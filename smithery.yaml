startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      fingridApiKey:
        type: string
        description: Optional free CC BY 4.0 API key from data.fingrid.fi (required only for fingrid_* tools).
  commandFunction:
    |-
    (config) => ({
      command: 'node',
      args: ['src/index.js'],
      env: config.fingridApiKey ? { FINGRID_API_KEY: config.fingridApiKey } : {}
    })
